name: test

# The corpus is fetched rather than committed — other projects' schemas are
# not ours to redistribute — so the schema tests skip cleanly when it is
# absent. A pull request gets the fast, hermetic half; the corpus runs on a
# schedule and on main, where a token lifts the API rate limit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # `postgresql_embedded` resolves its Postgres build through the GitHub API in
  # a build script, so *compiling* the tests needs it — and unauthenticated
  # runners share a rate limit they lose. The first run after publishing failed
  # on `403 rate limit exceeded` while linting, which is a confusing way to be
  # told nothing is wrong with the code.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    name: unit tests, lints, formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: rust-toolchain.toml decides, so CI and a laptop lint
      # against the same compiler.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      # No database needed: these are the parsers and the graph, which are
      # where most of the logic lives and all of it is pure.
      - run: cargo test --lib

  msrv:
    name: the oldest compiler it claims to build on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-toolchain.toml` would override this, and the point here is to
      # use a different compiler from the one it names.
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      # `rust-version` in Cargo.toml is a promise to anybody running
      # `cargo install`. It said 1.75 for months and nothing had ever tried it,
      # which is the same kind of untested claim this project exists to avoid.
      #
      # The library and the binary, and deliberately not `--all-targets`: that
      # pulls in dev-dependencies, and `postgresql_embedded` wants 1.87. A
      # contributor running `cargo test` therefore needs a newer compiler than
      # a user running `cargo install`, and this promise is the user's one.
      # The first version of this job did use `--all-targets` and failed for
      # exactly that reason, which is the job working.
      - run: cargo build --locked

  database:
    name: against a real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      # `postgresql_embedded` downloads and starts its own server, so there is
      # no service container here and no version drift between CI and a laptop.
      - run: cargo test --test oracle --test introspection --test cli -- --test-threads=1

  corpus:
    name: twenty-four real schemas
    # Not on pull requests: it fetches several megabytes from other people's
    # repositories, and a fork's token cannot do that.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: fetch the corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/corpus/fetch.py
      # The gate: every statement generated for every schema, judged by the
      # database. Zero rejections, not a percentage.
      - run: cargo test --test corpus -- --test-threads=1 --nocapture
