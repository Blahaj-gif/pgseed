<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-label="pgseed --plan naming the one table it refuses and quoting the constraint">
  <style>
    .m { font: 13.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <rect width="720" height="446" rx="10" fill="#0d1117"/>
  <path d="M0 10a10 10 0 0 1 10-10h700a10 10 0 0 1 10 10v30H0z" fill="#161b22"/>
  <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/><circle cx="38" cy="20" r="5.5" fill="#febc2e"/><circle cx="56" cy="20" r="5.5" fill="#28c840"/>
  <text x="360.0" y="25" text-anchor="middle" class="m" fill="#7d8590">pgseed</text>
    <text x="22" y="50" class="m"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" xml:space="preserve"> pgseed --dsn $DATABASE_URL --plan</tspan></text>
  <text x="22" y="92" class="m" fill="#58a6ff" xml:space="preserve">pgseed: 8 tables, 7 fillable, 1 refused (88% reach)</text>
  <text x="22" y="155" class="m" fill="#c9d1d9" xml:space="preserve">  would fill, in this order:</text>
  <text x="22" y="176" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_last_reconcile 25</text>
  <text x="22" y="197" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_scip_documents 25</text>
  <text x="22" y="218" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_scip_documents_dereference_logs 25</text>
  <text x="22" y="239" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_scip_metadata 25</text>
  <text x="22" y="260" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_scip_symbol_names 25</text>
  <text x="22" y="281" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_scip_document_lookup 25</text>
  <text x="22" y="302" class="m" fill="#c9d1d9" xml:space="preserve">    codeintel_scip_symbols 25</text>
  <text x="22" y="344" class="m" fill="#c9d1d9" xml:space="preserve">  refused:</text>
  <text x="22" y="365" class="m" fill="#d29922" xml:space="preserve">tenants CHECK &quot;tenant_name_valid_chars&quot; CHECK ((name ~</text>
  <text x="22" y="386" class="m" fill="#7d8590" xml:space="preserve">&#x27;^[a-z](?:[a-z0-9\_-])*[a-z0-9]$&#x27;::text)) — this cannot prove a generated row</text>
  <text x="22" y="407" class="m" fill="#c9d1d9" xml:space="preserve">satisfies it, so it will not write one</text>
</svg>
