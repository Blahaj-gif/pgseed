[package]
name = "pgseed"
version = "0.1.0"
edition = "2021"
description = "Reads a Postgres schema and generates data that satisfies it — or names the table it will not touch, and why"
license = "MIT"
repository = "https://github.com/Blahaj-gif/pgseed"
keywords = ["postgres", "seed", "test-data", "fixtures", "database"]
categories = ["command-line-utilities", "database"]
# Verified, not guessed: CI builds with exactly this compiler on every
# push. It used to say 1.75, which nothing had ever tried — and 1.75's
# cargo cannot even fetch this crate's dependencies.
rust-version = "1.85"
# Build infrastructure a consumer of the crate has no use for. In
# particular `rust-toolchain.toml` pins 1.94 for developing here, and
# shipping it inside the package invites it to pin somebody else's build.
exclude = [".github/", "rust-toolchain.toml"]

[dependencies]
# Postgres, synchronously. No async runtime: this is a CLI that does one job
# and exits, and tokio would be a large dependency bought for nothing.
postgres = "0.19"
# Argument parsing. `derive` keeps the flags and their help text in one place,
# so the two cannot drift.
clap = { version = "4", features = ["derive", "env"] }
# Deterministic value generation. `rand_chacha` rather than the default
# generator because it is reproducible across platforms and versions, which is
# the whole point — see generate::rng.
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_chacha = "0.3"

[dev-dependencies]
# The corpus is described once, in tests/corpus/sources.json — the URL, the
# licence, and how many constraints its replay is known to lose. A second list
# in Rust that had to be kept in step by hand was one list too many.
serde_json = "1"

# A real Postgres, downloaded and run per test, with no Docker and no install.
# The entire correctness argument of this tool is that the database adjudicates,
# so the tests need a database rather than a model of one.
postgresql_embedded = { version = "0.19", features = ["blocking", "bundled"] }

[features]
# Integration tests download a Postgres on first run, so they are opt-in:
#   cargo test                        unit tests, no network, no database
#   cargo test --features integration everything, against a real Postgres
integration = []

[profile.release]
strip = true
lto = true
opt-level = "z"
